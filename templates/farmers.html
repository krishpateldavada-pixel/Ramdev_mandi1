{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-mandi">Farmers Directory</h3>
    <button class="btn btn-mandi" data-bs-toggle="modal" data-bs-target="#addFarmerModal"><i class="fa-solid fa-plus me-1"></i> Add Farmer</button>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <form method="GET" action="{{ url_for('farmers') }}" class="row g-2">
            <div class="col-md-10">
                <input type="text" name="search" class="form-control" placeholder="Search by name, mobile, village..." value="{{ search }}">
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-mandi">Search</button>
            </div>
        </form>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>ID</th><th>Farmer Name</th><th>Mobile</th><th>Village</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for f in farmers %}
                    <tr>
                        <td>#{{ f.id }}</td>
                        <td class="fw-bold">{{ f.name }}</td>
                        <td>{{ f.mobile }}</td>
                        <td>{{ f.village }}</td>
                        <td>
                            <a href="{{ url_for('farmer_details', id=f.id) }}" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-eye me-1"></i> Ledger & History</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center text-muted py-3">No farmers found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Add Farmer -->
<div class="modal fade" id="addFarmerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('farmers') }}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-mandi">Add New Farmer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Farmer Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mobile Number *</label>
                        <input type="text" name="mobile" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Village *</label>
                        <input type="text" name="village" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-mandi">Save Farmer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
