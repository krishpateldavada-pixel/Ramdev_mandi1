{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-mandi">Customers Directory</h3>
    <button class="btn btn-mandi" data-bs-toggle="modal" data-bs-target="#addCustomerModal"><i class="fa-solid fa-plus me-1"></i> Add Customer</button>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <form method="GET" action="{{ url_for('customers') }}" class="row g-2">
            <div class="col-md-10">
                <input type="text" name="search" class="form-control" placeholder="Search customer name, mobile, address..." value="{{ search }}">
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-mandi">Search</button>
            </div>
        </form>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>ID</th><th>Customer Name</th><th>Mobile</th><th>Address</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for c in customers %}
                    <tr>
                        <td>#{{ c.id }}</td>
                        <td class="fw-bold">{{ c.name }}</td>
                        <td>{{ c.mobile }}</td>
                        <td>{{ c.address }}</td>
                        <td>
                            <a href="{{ url_for('customer_details', id=c.id) }}" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-eye me-1"></i> Ledger & Sales</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center text-muted py-3">No customers found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Add Customer -->
<div class="modal fade" id="addCustomerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('customers') }}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-mandi">Add New Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Customer Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mobile Number *</label>
                        <input type="text" name="mobile" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address *</label>
                        <textarea name="address" class="form-control" rows="2" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-mandi">Save Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
