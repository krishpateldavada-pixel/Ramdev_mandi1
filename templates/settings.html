{% extends "base.html" %}
{% block content %}
<div class="card border-0 shadow-sm max-w-800 mx-auto">
    <div class="card-header bg-mandi text-white py-3">
        <h5 class="fw-bold mb-0"><i class="fa-solid fa-gear me-2"></i>System & Business Settings</h5>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('settings') }}">
            <h6 class="fw-bold text-mandi mb-3"><i class="fa-solid fa-building me-1"></i> Business Profile Branding</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Business Name</label>
                    <input type="text" name="business_name" class="form-control" value="{{ biz.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Shop Number</label>
                    <input type="text" name="shop_no" class="form-control" value="{{ biz.shop_no }}" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Market APMC Name</label>
                    <input type="text" name="market" class="form-control" value="{{ biz.market }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Business Type</label>
                    <input type="text" name="business_type" class="form-control" value="{{ biz.type }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Location Address</label>
                <input type="text" name="location" class="form-control" value="{{ biz.location }}" required>
            </div>

            <hr class="my-4">

            <h6 class="fw-bold text-mandi mb-3"><i class="fa-solid fa-scale-balanced me-1"></i> Lot System Configuration</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">1 Lot Weight (in KG)</label>
                    <input type="number" step="0.1" name="lot_weight_kg" class="form-control" value="{{ biz.lot_weight }}" required>
                    <div class="form-text">System default is 20 KG. Updating this changes auto-conversions globally.</div>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-mandi px-4">Save Configuration</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
