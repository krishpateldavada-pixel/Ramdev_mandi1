{% extends "base.html" %}
{% block content %}
<div class="card border-0 shadow-sm max-w-800 mx-auto">
    <div class="card-header bg-mandi text-white py-3">
        <h5 class="fw-bold mb-0"><i class="fa-solid fa-cash-register me-2"></i>New Customer Sale / Invoice Entry</h5>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('sale_form') }}">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Date *</label>
                    <input type="date" name="date" class="form-control" value="{{ today }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Select Customer *</label>
                    <select name="customer_id" class="form-select" required>
                        <option value="">-- Choose Customer --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }} ({{ c.address }}) - {{ c.mobile }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Product *</label>
                    <select name="product_id" class="form-select" required>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Available: {{ p.stock_kg }} KG / {{ "%.1f"|format(p.stock_kg / biz.lot_weight) }} Lots)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Quantity (Lots) *</label>
                    <input type="number" step="0.01" id="lots" name="lots" class="form-control" required placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Quantity (KG)</label>
                    <input type="number" step="0.01" id="kg" name="kg" class="form-control bg-light" readonly placeholder="Calculated">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Selling Rate per KG (₹) *</label>
                    <input type="number" step="0.01" id="rate" name="selling_rate_per_kg" class="form-control" required placeholder="0.00">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Discount (₹)</label>
                    <input type="number" step="0.01" id="discount" name="discount" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Transport Charges (₹)</label>
                    <input type="number" step="0.01" id="transport" name="transport_charges" class="form-control" value="0">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Other Charges (₹)</label>
                    <input type="number" step="0.01" id="other" name="other_charges" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Gross Amount (₹)</label>
                    <input type="number" step="0.01" id="gross_amount" name="gross_amount" class="form-control bg-light" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Initial Paid Amount (₹)</label>
                    <input type="number" step="0.01" name="paid_amount" class="form-control" value="0">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Notes / Remarks</label>
                    <input type="text" name="notes" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('sales') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-mandi px-4">Save & Generate Invoice</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
