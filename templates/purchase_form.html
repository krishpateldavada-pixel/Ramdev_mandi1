{% extends "base.html" %}
{% block content %}
<div class="card border-0 shadow-sm max-w-800 mx-auto">
    <div class="card-header bg-mandi text-white py-3">
        <h5 class="fw-bold mb-0"><i class="fa-solid fa-cart-flatbed me-2"></i>New Farmer Purchase Entry</h5>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('purchase_form') }}">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Date *</label>
                    <input type="date" name="date" class="form-control" value="{{ today }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Select Farmer *</label>
                    <select name="farmer_id" class="form-select" required>
                        <option value="">-- Choose Farmer --</option>
                        {% for f in farmers %}
                        <option value="{{ f.id }}">{{ f.name }} ({{ f.village }}) - {{ f.mobile }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Product *</label>
                    <select name="product_id" class="form-select" required>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Quantity (Lots) *</label>
                    <input type="number" step="0.01" id="lots" name="lots" class="form-control" required placeholder="0">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Quantity (KG)</label>
                    <input type="number" step="0.01" id="kg" name="kg" class="form-control bg-light" readonly placeholder="Calculated">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Rate per KG (₹) *</label>
                    <input type="number" step="0.01" id="rate" name="rate_per_kg" class="form-control" required placeholder="0.00">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Quality / Grade</label>
                    <input type="text" name="quality" class="form-control" placeholder="e.g. Best, Medium">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Moisture %</label>
                    <input type="number" step="0.1" name="moisture" class="form-control" placeholder="0.0">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">Lot / Batch No.</label>
                    <input type="text" name="lot_number" class="form-control" placeholder="Optional">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Transport Charges (₹)</label>
                    <input type="number" step="0.01" id="transport" name="transport_charges" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Other Charges (₹)</label>
                    <input type="number" step="0.01" id="other" name="other_charges" class="form-control" value="0">
                </div>
            </div>

            <hr>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Gross Amount (₹)</label>
                    <input type="number" step="0.01" id="gross_amount" name="gross_amount" class="form-control bg-light" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Initial Paid Amount (₹)</label>
                    <input type="number" step="0.01" name="paid_amount" class="form-control" value="0">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Notes / Remarks</label>
                    <input type="text" name="notes" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('purchases') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-mandi px-4">Save & Generate Receipt</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
